<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <style>
    .float { animation: float 6s ease-in-out infinite; }
    .float-s { animation: floatS 5s ease-in-out infinite; }
    .flow { animation: flow 3s linear infinite; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes floatS { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes flow { from { stroke-dashoffset: 134; } to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F5AF0"/><stop offset="1" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/><stop offset="1" stop-color="#161D33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2140"/><stop offset="1" stop-color="#0F1428"/>
    </linearGradient>
    
  </defs>
  
  <rect width="1200" height="170" rx="24" fill="url(#panel)"/>
