# ZIUAI starter CI for Python services.
# Runs on every pull request and on pushes to the default branch.
# Expects a pyproject.toml with ruff and pytest configured, and dev
# dependencies installable with `pip install -e ".[dev]"`.
#
# After adding the org secrets SONAR_TOKEN and SONAR_HOST_URL, uncomment the
# SonarQube steps at the bottom so the quality gate blocks the merge.

name: CI

on:
  pull_request:
  push:
    branches: [$default-branch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (if mypy is installed)
        run: python -m mypy . || echo "mypy not configured; skipping"

      - name: Test with coverage
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      # - name: SonarQube scan
      #   uses: SonarSource/sonarqube-scan-action@v5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #
      # - name: SonarQube quality gate
      #   uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan working tree with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --no-git --redact --exit-code 1

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit dependencies with pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit
